name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Smoke-test the analyser on the sample corpus
        # analyze exits 1 when it finds phishing - for the phishing sample
        # that is the expected, passing outcome
        run: |
          python -m phishscope analyze samples/legit_01_newsletter.eml --json > /dev/null
          python -m phishscope analyze samples/phishing_01_paylookalike.eml --json > /dev/null && exit 1 || test $? -eq 1
